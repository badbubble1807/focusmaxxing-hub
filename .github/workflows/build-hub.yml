# Builds Focusmaxxing Hub in the cloud.
#
# Run it from the Actions tab (or from the PC with the dispatch script in the
# focusmaxxing-mobile repository). It compiles the app the same way SideStore's
# own nightly build does: Xcode on a macOS runner, then a fake signature so the
# hub can sign itself properly on the phone.
#
# The finished app lands on the "hub" release as focusmaxxing-hub.ipa, and the
# hub's own entry in source/apps.json is bumped to the new version so an
# installed hub offers the update by itself.

name: build hub

on:
  workflow_dispatch:

concurrency:
  group: build-hub
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: build hub
    runs-on: macos-26
    env:
      VERSION: 1.0.${{ github.run_number }}

    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: tools
        run: brew install ldid xcbeautify

      - name: xcode
        uses: maxim-lobanov/setup-xcode@v1.6.0
        with:
          xcode-version: "26.4"

      # the swift build is slow from cold; keep xcode's intermediate files between runs
      - name: build cache
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: hub-xcode-${{ github.sha }}
          restore-keys: |
            hub-xcode-

      # three of the packages point at the same OpenSSL download; on a cold runner swift fetches it
      # three times at once and trips over itself ("already exists in file system"). resolving the
      # packages on their own first, and again if that fails, leaves the download cached and the
      # real build finds it there. the cache below keeps it warm for the next run.
      - name: package downloads cache
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: hub-packages-v1

      - name: resolve packages
        run: |
          for attempt in 1 2 3; do
            echo "resolve attempt $attempt"
            if xcodebuild -resolvePackageDependencies -project AltStore.xcodeproj -scheme SideStore > resolve.log 2>&1; then
              echo "packages resolved"
              break
            fi
            tail -n 20 resolve.log
            if [ "$attempt" = "3" ]; then echo "could not resolve packages"; exit 1; fi
            sleep 5
          done

      - name: build
        run: |
          set -o pipefail
          echo "version $VERSION"
          NSUnbufferedIO=YES MARKETING_VERSION="$VERSION" make -B build 2>&1 | tee build.log | xcbeautify --renderer github-actions
          # no widget extension: at start the hub records its own extensions and needs a provisioning
          # profile for each; a third-party signer signs the app but not the widget, and the hub then
          # refuses to start. the widget was only a home-screen nicety.
          rm -rf SideStore.xcarchive/Products/Applications/SideStore.app/PlugIns
          ls SideStore.xcarchive/Products/Applications/SideStore.app
          make fakesign 2>&1 | tee -a build.log
          make ipa 2>&1 | tee -a build.log
          mv SideStore.ipa focusmaxxing-hub.ipa
          ls -la focusmaxxing-hub.ipa

      - name: show the errors if the build failed
        if: failure()
        run: |
          echo "==== last lines of build.log ===="
          tail -n 120 build.log || true
          echo "==== lines with 'error' ===="
          grep -n "error:" build.log | tail -n 40 || true

      - name: keep the build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: keep a copy
        uses: actions/upload-artifact@v4
        with:
          name: focusmaxxing-hub
          path: focusmaxxing-hub.ipa
          if-no-files-found: error

      - name: publish to the hub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: hub
          name: Focusmaxxing Hub
          body: "Focusmaxxing Hub ${{ env.VERSION }}. Open focusmaxxing-hub.ipa on the phone with the hub you already have, or install it with the computer step."
          files: focusmaxxing-hub.ipa
          draft: false
          prerelease: false
          make_latest: true

      # the hub reads source/apps.json for updates; point its own entry at this build
      - name: bump the hub entry in the app list
        continue-on-error: true
        run: |
          node scripts/fmx/update-source.js "$VERSION" focusmaxxing-hub.ipa "https://github.com/$GITHUB_REPOSITORY/releases/download/hub/focusmaxxing-hub.ipa"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source/apps.json
          git commit -m "app list: hub $VERSION" || exit 0
          git push
