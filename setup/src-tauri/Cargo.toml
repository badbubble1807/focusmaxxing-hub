[package]
name = "focusmaxxing-setup"
version = "1.0.0"
description = "Focusmaxxing Setup: puts Focusmaxxing Hub on an iPhone from a Windows PC"
authors = ["Focusmaxxing", "nab138"]
edition = "2024"

# focusmaxxing setup is a trimmed fork of iloader (https://github.com/nab138/iloader, MIT).
# the crates below are iloader's; only the ones this program no longer needs are gone
# (the auto-updater, the process plugin and the file dialogs).

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "focusmaxxing_setup_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# "amfi" is the developer mode service, "installation_proxy" lists the phone's apps; the rest is iloader's list
idevice = { version = "0.1.57", features = ["usbmuxd", "house_arrest", "afc", "core_device_proxy", "remote_pairing", "tcp", "tunnel_tcp_stack", "xpc", "rsd", "pair", "amfi", "installation_proxy"] }
isideload = { version = "0.3.17", features = ["fs-storage"], git = "https://github.com/nab138/isideload", package = "isideload", branch = "apple-codesign-quick" }
keyring = { version = "3.6.3", features = ["apple-native", "windows-native", "linux-native-sync-persistent"] }
tauri-plugin-store = "2"
futures = "0.3.31"
once_cell = "1.21.3"
reqwest = "0.13.2"
tokio = "1.49.0"
chrono = "0.4"
tracing-subscriber = "0.3.22"
tracing = "0.1.44"
tracing-appender = "0.2"
rustls = "0.23.36"
plist = "1.8.0"
plist-macro = "0.1.6"
tokio-util = "0.7.18"
rootcause = "0.12.1"
thiserror = "2.0.18"
# the two pieces of the signing certificate, written out for the hub to pick up (see
# sideload.rs, hand_certificate_to_hub). both versions are the ones the signing library
# itself uses, so nothing new is compiled.
rsa = "0.9.10"
x509-cert = "0.2.5"
strum = {version = "0.28.0", features = ["derive"] }
